[project]
name = "task03-rag-based-document-qa-system"
version = "1.0.0"
description = "Nexoramind Task 03 - Retrieval-Augmented Generation (RAG) Document Q&A System with FastAPI, FAISS, and sentence-transformers"
authors = [
    { name = "Krishna Gupta" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=2.5.0",
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "pypdf>=4.1.0",
    "python-docx>=1.1.0",
    "streamlit>=1.32.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
